<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список дел</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        #newtask {
            padding: 20px;
            display: flex;
            gap: 10px;
        }

        #taskInput {
            flex: 1;
            height: 50px;
            padding: 0 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        #taskInput:focus {
            border-color: #667eea;
        }

        #push {
            width: 50px;
            height: 50px;
            background: #667eea;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        #tasks {
            padding: 0 20px 20px 20px;
            min-height: 100px;
        }

        .task {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task span {
            flex: 1;
            font-size: 16px;
        }

        .delete {
            background: #ff6b6b;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .stats {
            padding: 15px;
            background: #f8f9fa;
            text-align: center;
            border-top: 1px solid #eee;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Мой список дел</h1>
            <p>Организуйте свои задачи эффективно</p>
        </div>
        
        <div id="newtask">
            <input type="text" placeholder="Введите новую задачу..." id="taskInput">
            <button id="push" title="Добавить задачу">+</button>
        </div>
        
        <div id="tasks"></div>
        
        <div class="stats">
            <span id="taskCount">Задач: 0</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const taskInput = document.getElementById('taskInput');
            const pushButton = document.getElementById('push');
            const tasksContainer = document.getElementById('tasks');
            const taskCount = document.getElementById('taskCount');
            
            function updateTaskCount() {
                const count = document.querySelectorAll('.task').length;
                taskCount.textContent = `Задач: ${count}`;
            }
            
            function addTask() {
                const taskText = taskInput.value.trim();
                
                if (taskText === '') {
                    alert('Пожалуйста, введите задачу!');
                    return;
                }
                
                const taskHTML = `
                    <div class="task">
                        <span>${taskText}</span>
                        <button class="delete">×</button>
                    </div>
                `;
                
                tasksContainer.innerHTML += taskHTML;
                taskInput.value = '';
                taskInput.focus();
                
                // Добавляем обработчики удаления для новых задач
                const deleteButtons = document.querySelectorAll('.delete');
                deleteButtons.forEach(button => {
                    button.onclick = function() {
                        this.parentElement.remove();
                        updateTaskCount();
                    };
                });
                
                updateTaskCount();
            }
            
            // Обработчики событий
            pushButton.addEventListener('click', addTask);
            
            taskInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTask();
                }
            });
            
            // Инициализация
            updateTaskCount();
        });
    </script>
</body>
</html>
